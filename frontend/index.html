<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lattice — turn any idea into an explainer video</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Geist:wght@400;450;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="app"></div>

  <!-- 3D laptop intro overlay. MUST stay a sibling of #app (outside it):
       app.js does $("app").innerHTML = … on every render and would wipe it otherwise. -->
  <div id="intro-root" style="position:fixed;inset:0;z-index:9999;background:radial-gradient(120% 90% at 50% 38%, #17171d 0%, #0E0E12 55%, #08080b 100%);"></div>
  <script>
    // hard backstop: if the intro ever hangs, reveal the app anyway (intro itself ends ~7.6s)
    setTimeout(function(){var r=document.getElementById('intro-root');if(r){r.style.transition='opacity .4s';r.style.opacity='0';setTimeout(function(){r.remove();},450);}},16000);
  </script>

  <script src="/static/config.js"></script>
  <script src="/static/feedback.js"></script>
  <script src="/static/decks.js"></script>
  <script src="/static/learn.js"></script>
  <script src="/static/app.js"></script>
  <script type="module" src="/static/intro.js"></script>
</body>
</html>
